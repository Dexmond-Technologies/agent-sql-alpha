[package]
name = "agentsql"
version = "0.0.1"
description = "agentSQL — AI-assisted SQL analysis and controlled execution by Dexmond Technologies"
authors = ["Dexmond Technologies - Ireland"]
homepage = "https://dexmond.com"
edition = "2021"

[lib]
name = "agentsql_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks", "backup"] }
keyring = "3"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "chrono", "uuid", "json", "bigdecimal"] }
tiberius = { version = "0.12.3", default-features = false, features = ["rustls", "tds73", "chrono", "time", "bigdecimal"] }
bigdecimal = "0.4"
urlencoding = "2"
regex = "1"
